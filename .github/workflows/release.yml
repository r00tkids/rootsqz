name: Build and Release

on:
  push:
    tags:
      - "v*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64

      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the crate and the npm packages have one version
        run: node scripts/set-version.mjs --check
      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild
      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          node scripts/build-target.mjs ${{ matrix.target }}
      # The artifact is the bin directory of the platform package npm/<platform>,
      # so a job that publishes to npm can download it into place.
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: rootsqz-${{ matrix.target }}
          path: npm/${{ matrix.platform }}/bin/
          if-no-files-found: error
          retention-days: 2
  release:
    needs: build
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: rootsqz-*
          path: bin
          merge-multiple: false
      - name: Name the assets after their target
        run: |
          mkdir assets
          for dir in bin/rootsqz-*; do
            name=$(basename "$dir")
            if [ -f "$dir/rootsqz.exe" ]; then
              cp "$dir/rootsqz.exe" "assets/$name.exe"
            else
              cp "$dir/rootsqz" "assets/$name"
            fi
          done
          ls -l assets
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: assets/*
          fail_on_unmatched_files: true
