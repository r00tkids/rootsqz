[package]
name = "rootsqz"
authors = ["Emil Sandstø"]
description = "Rootsqz is a tool for compressing and decompressing demo intros for web."
version = "0.7.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
bitflags = "2.10.0"
brotli = "9.0.0"
bytes = "1.11.0"
clap = { version="4.5.54", features = ["derive"] }
handlebars = "6.4.0"
human-panic = "2.0.6"
serde = { version="1.0.228", features=["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version="0.3.22", features = ["fmt", "env-filter"] }
zopfli = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
rand = "0.9.2"
